[project]
name = "iomanager-lifecycle-demo"
version = "0.1.0"
description = "Empirical demo of Dagster IOManager / resource lifecycle scoping"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9",
    "sqlalchemy>=2.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifecycle_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
