# Example GitHub Action: using Podman instead of Docker
#
# Podman is a drop-in, daemonless replacement for Docker. Most `docker ...`
# commands work unchanged as `podman ...`, so migrating a Docker-based workflow
# is usually a matter of swapping the binary. This example builds and runs a
# containerized Dagster project image using Podman.
#
# Key differences from Docker highlighted below:
#   - No Docker daemon required; Podman is daemonless and runs rootless.
#   - `podman` is CLI-compatible with `docker` (you can even `alias docker=podman`).
#   - Podman is pre-installed on GitHub-hosted Ubuntu runners, so no setup step
#     is needed to get the `podman` binary.

name: Podman Example (Docker replacement)

on:
  # Run on pushes and PRs that touch the workflow or project sources.
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # Image coordinates reused across steps.
    env:
      IMAGE: localhost/dagster-demo:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Podman version
        # Podman ships preinstalled on ubuntu-latest runners — no install needed.
        run: |
          podman version
          podman info --format '{{.Host.Security.Rootless}}' && echo "rootless: OK"

      # Optional convenience: make `docker` resolve to `podman` so that existing
      # scripts, Makefiles, or tools calling `docker` keep working unchanged.
      - name: Alias docker -> podman (optional compatibility shim)
        run: |
          sudo ln -sf "$(command -v podman)" /usr/local/bin/docker
          docker --version   # this now runs podman

      - name: Write an example Dagster Containerfile
        # A Containerfile is identical in syntax to a Dockerfile. Podman reads
        # either name; we use `Containerfile` to make the Podman idiom explicit.
        run: |
          cat > Containerfile <<'EOF'
          FROM python:3.11-slim

          WORKDIR /opt/dagster/app

          # Install Dagster. In a real project you would copy pyproject.toml /
          # requirements and your `defs/` source tree instead.
          RUN pip install --no-cache-dir dagster dagster-webserver

          # A minimal Definitions module so the image has something to load.
          RUN mkdir -p demo && \
              printf 'import dagster as dg\n\n@dg.asset\ndef hello() -> str:\n    return "world"\n\ndefs = dg.Definitions(assets=[hello])\n' \
                > demo/definitions.py

          ENV DAGSTER_HOME=/opt/dagster/home
          RUN mkdir -p "$DAGSTER_HOME"

          # Default: start the Dagster webserver serving the demo definitions.
          EXPOSE 3000
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "demo.definitions"]
          EOF

      - name: Build the image with Podman
        # Equivalent to `docker build`. `--format docker` produces a Docker v2
        # schema image for maximum registry compatibility.
        run: |
          podman build --format docker -t "$IMAGE" -f Containerfile .

      - name: Inspect the built image
        run: podman images "$IMAGE"

      - name: Validate the Dagster definitions inside the container
        # `podman run` mirrors `docker run`. We override CMD to run `dagster
        # definitions validate`, which exits non-zero if the defs are broken —
        # a fast smoke test for the built image.
        run: |
          podman run --rm "$IMAGE" \
            dagster definitions validate -m demo.definitions

      - name: Smoke-test the webserver
        # Start the container detached, wait for the server, hit the health
        # endpoint, then clean up. `-d`, `-p`, `logs`, `stop`, and `rm` all
        # behave the same as their Docker counterparts.
        run: |
          podman run -d --name dagster-demo -p 3000:3000 "$IMAGE"

          echo "Waiting for the Dagster webserver to come up..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/server_info >/dev/null 2>&1; then
              echo "Webserver is up."
              break
            fi
            sleep 2
          done

          echo "=== container logs ==="
          podman logs dagster-demo || true

          # Final assertion: the endpoint must respond.
          curl -fsS http://localhost:3000/server_info

      - name: Tear down
        if: always()
        run: |
          podman stop dagster-demo || true
          podman rm dagster-demo || true

  # Optional second job: push the image to GitHub Container Registry with Podman.
  # Runs only on pushes to main. Uses the built-in GITHUB_TOKEN — no extra
  # secrets required. `podman login` / `podman push` mirror the Docker CLI.
  publish:
    needs: build-and-run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Recreate the Containerfile
        run: |
          cat > Containerfile <<'EOF'
          FROM python:3.11-slim
          WORKDIR /opt/dagster/app
          RUN pip install --no-cache-dir dagster dagster-webserver
          RUN mkdir -p demo && \
              printf 'import dagster as dg\n\n@dg.asset\ndef hello() -> str:\n    return "world"\n\ndefs = dg.Definitions(assets=[hello])\n' \
                > demo/definitions.py
          ENV DAGSTER_HOME=/opt/dagster/home
          RUN mkdir -p "$DAGSTER_HOME"
          EXPOSE 3000
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "demo.definitions"]
          EOF

      - name: Log in to GitHub Container Registry with Podman
        # Same flags as `docker login`.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push with Podman
        run: |
          podman build --format docker -t "$REGISTRY_IMAGE" -f Containerfile .
          podman push "$REGISTRY_IMAGE"
